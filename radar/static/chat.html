<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 기술 레이더 · 대화</title><link rel="stylesheet" href="/static/chat.css"><script src="/static/chat.js" defer></script></head>
<body><main><header><div class="brand"><span class="mark">◉</span><div><p class="eyebrow">AI TECHNOLOGY RADAR</p><h1>지식과 함께 생각하기</h1></div></div><button id="new" class="secondary">새 대화</button></header>
<section class="intro"><h2>기술을 이해하고, 선택을 비교하세요.</h2><p>내 기술 레퍼런스와 원문을 근거로 설명합니다. 저장된 사실, 기술적 해석, 불확실성을 구분해 답합니다.</p><div class="suggestions"><button data-question="RAG와 MCP의 역할은 어떻게 다르고, 사내 문서 QA에 어떻게 함께 사용할 수 있나요?">RAG와 MCP 비교</button><button data-question="LLM의 KV cache는 무엇이고 어떤 절충이 있나요?">KV cache 이해하기</button></div></section>
<div id="messages" role="log" aria-live="polite" aria-label="대화 기록"></div>
<p id="error" role="alert" hidden></p><p id="loading" role="status" hidden>근거를 찾고 답변을 구성하고 있어요…</p>
<form id="form"><label for="question">AI 기술에 대해 질문하세요</label><div class="composer"><textarea id="question" maxlength="1000" rows="2" placeholder="개념, 비교, 구현 조건을 자유롭게 물어보세요." required></textarea><button id="send" type="submit">질문하기 <span aria-hidden="true">↗</span></button></div><p class="hint">Enter로 전송 · Shift+Enter로 줄바꿈 · 중요한 설계 결정은 원문을 확인하세요.</p></form>
<footer><span id="status">지식 저장소 확인 중</span><span>대화 내용은 기본 로그에 저장하지 않습니다.</span></footer></main></body></html>
