name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python 3.12 offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ''
      NOTION_TOKEN: ''
      NOTION_PARENT_PAGE_ID: ''
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      GEMINI_BILLING_DISABLED: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install project in a clean environment
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/radar-ci-venv"
          "$RUNNER_TEMP/radar-ci-venv/bin/python" -m pip install ".[chat,test]"
          echo "$RUNNER_TEMP/radar-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Check installed dependencies
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci_offline
        run: python -m pip check

      - name: Run all regression tests (no skips)
        id: regressions
        timeout-minutes: 2
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci_offline
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/radar-regressions.log"
          python scripts/ci_check_regressions.py "$RUNNER_TEMP/radar-regressions.log"

      - name: Run deterministic retrieval evaluation (${{ steps.regressions.outputs.test_count }} regression tests)
        timeout-minutes: 2
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci_offline
        run: python scripts/ci_evaluate.py

      - name: Evaluate conversational retrieval offline
        timeout-minutes: 2
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci_offline
        run: python scripts/ci_chat_evaluate.py

      - name: Smoke test installed CLI
        timeout-minutes: 2
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/ci_offline
        run: python scripts/ci_smoke.py
