[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-technology-radar"
version = "0.1.0"
description = "Local-first AI research radar with Gemini, SQLite, and Notion"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["sample.json"]
