[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-technology-radar"
version = "0.1.0"
description = "Local-first AI research radar with Gemini, SQLite, and Notion"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
chat = ["fastapi==0.162.0", "uvicorn==0.54.0"]
test = ["httpx==0.28.1"]

[project.scripts]
ai-radar = "radar.cli:main"
radar-chat = "radar.chat_web:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["sample.json", "data/*.json", "static/*"]
# Curated starter notes are engineering references, separate from sample news.
